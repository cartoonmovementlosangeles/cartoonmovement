<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Comic — Cartoon Movement</title>
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>

  <header class="reader-header">
    <a class="back-link" href="../../index.html">&larr; All comics</a>
    <h1>Example Comic</h1>
  </header>

  <!-- READER STRIP
       One <img class="panel"> per page/panel, top to bottom, in reading
       order. Put your image files in assets/images/example-comic/ and
       point src at them. Panels fade in automatically as the reader
       scrolls to them (see assets/script.js). -->
  <section class="reader-strip">
    <img class="panel" src="../../assets/images/example-comic/panel-01.jpg" alt="Panel 1">
    <img class="panel" src="../../assets/images/example-comic/panel-02.jpg" alt="Panel 2">
    <img class="panel" src="../../assets/images/example-comic/panel-03.jpg" alt="Panel 3">
    <!-- Add more panels here -->
  </section>

  <div class="reader-end">
    <a href="../../index.html">Back to all comics &rarr;</a>
  </div>

  <script src="../../assets/script.js"></script>
</body>
</html>
